<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Zyntech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f8fafc; overflow-y: auto; height: auto; }
        .checkout-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        .checkout-box { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        .checkout-box h3 { margin-bottom: 20px; color: #0f172a; font-size: 18px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 14px; }
        .order-summary-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: #475569; }
        .total-row { border-top: 2px dashed #e2e8f0; padding-top: 12px; font-weight: 700; color: #0f172a; font-size: 16px; }
        .place-order-btn { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .place-order-btn:hover { background: #0369a1; }
        @media (max-width:768px){ .checkout-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
           
             <img src="img/zynteck.png" alt="Zyntech Logo" class="logo-img" width="100" height="auto">
               <img src="img/zyntechnametp.png" alt="Zyntech Logo" class="logo-img" width="110" height="auto">
        </div>
        <a href="index.html" class="btn secondary-btn" style="color:#0284c7; border-color:#0284c7;"><i class="fa-solid fa-arrow-left"></i> Back to Catalog</a>
    </header>

    <div class="checkout-container">
        <!-- Delivery Details -->
        <div class="checkout-box">
            <h3><i class="fa-solid fa-truck"></i> Shipping Information</h3>
            <form id="checkoutForm" onsubmit="event.preventDefault(); placeOrder();">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="custName" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="custPhone" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="custAddress" required>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="payMethod">
                        <option value="cod">Cash on Delivery</option>
                        <option value="card">Bank Transfer / Online Card</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="checkout-box">
            <h3><i class="fa-solid fa-receipt"></i> Order Summary</h3>
            <div id="summaryItems"></div>

            <div class="order-summary-item total-row">
                <span>Grand Total</span>
                <span id="grandTotal" style="color:#0284c7;">LKR 0</span>
            </div>
            <button class="place-order-btn" onclick="placeOrder()">Confirm & Place Order</button>
        </div>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('userCart')) || [];
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};

        if (cart.length === 0) window.location.href = "index.html";

        if (currentUser.name) document.getElementById('custName').value = currentUser.name;
        if (currentUser.phone) document.getElementById('custPhone').value = currentUser.phone;
        if (currentUser.address) document.getElementById('custAddress').value = currentUser.address;

        const summaryContainer = document.getElementById('summaryItems');
        let total = 0;

        summaryContainer.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            return `
                <div class="order-summary-item">
                    <span>${item.title} (x${item.qty})</span>
                    <span>LKR ${itemTotal.toLocaleString()}</span>
                </div>
            `;
        }).join('');

        document.getElementById('grandTotal').innerText = `LKR ${total.toLocaleString()}`;

        function placeOrder() {
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            if(!name || !address) return alert("Please fill details!");

            alert(`Thank you ${name}! Your hardware order has been successfully placed.\nShipping to: ${address}`);
            localStorage.removeItem('userCart');
            window.location.href = "index.html";
            
        }
    </script>
</body>
</html>
